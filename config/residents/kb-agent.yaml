cron:
- name: lint
  schedule: '@daily'
  at_time: "03:00"
  task: "Call run_lint to check all knowledge bases for orphan pages, broken wikilinks, and missing frontmatter"
- name: dedup
  schedule: '@weekly'
  task: "Call run_dedup to detect and merge duplicate content across all knowledge base wiki pages"
- name: overview
  schedule: '@weekly'
  task: "Call gen_overview to generate a fresh global summary of all knowledge base content into overview.md"
id: kb-agent
model: deepseek-v4-pro
name: 知识库管理员
page: /knowledge
role: resident
skills:
- knowledge-ingestion
