[project]
name = "cococat"
version = "0.1.0"
description = "CocoCat - Multi-Agent AI Collaboration Platform"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "typer>=0.20.0",
    "rich>=14.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pydantic>=2.0.0",
    "pyyaml>=5.0",
    "httpx>=0.24.0",
    "playwright>=1.40.0",
    "tavily-python>=0.3.0",
    "e2b>=2.0.0",
    "e2b-code-interpreter>=2.0.0",
    "pyjwt>=2.0.0",
    "python-multipart>=0.0.9",
]

[project.urls]
Repository = "https://github.com/liyifu-2026/CocoCat"

[project.scripts]
cococat = "cococat.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio", "httpx", "ruff>=0.12"]

[tool.ruff]
target-version = "py310"
exclude = ["cococat/tests/"]

[tool.ruff.lint]
select = ["F401", "F811", "F841"]

[tool.pytest.ini_options]
testpaths = ["tests", "cococat/tests"]
norecursedirs = ["tests/cococat"]

[tool.hatch.build.targets.wheel]
packages = ["cococat"]
