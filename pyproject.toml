[project]
name = "cococat"
version = "0.1.0"
description = "CocoCat - Multi-Agent AI Collaboration Platform CLI"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "typer>=0.20.0",
    "rich>=14.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pydantic>=2.0.0",
    "pyyaml>=5.0",
    "httpx>=0.24.0",
    "playwright>=1.40.0",
    "tavily-python>=0.3.0",
    "e2b>=2.0.0",
    "e2b-code-interpreter>=2.0.0",
]

[project.scripts]
cococat = "cli.main:entry_point"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["py-agent/cli"]

[tool.hatch.build.targets.wheel.sources]
"py-agent/cli" = "cli"
