[project]
name = "cococat"
version = "0.1.0"
description = "CocoCat - Multi-Agent AI Collaboration Platform CLI"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "typer>=0.20.0",
    "rich>=14.0.0",
]

[project.scripts]
cococat = "cli.main:entry_point"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["py-agent/cli"]

[tool.hatch.build.targets.wheel.sources]
"py-agent/cli" = "cli"
