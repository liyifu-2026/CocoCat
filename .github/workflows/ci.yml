name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e .
          pip install pytest pytest-asyncio httpx ruff

      - name: Lint with ruff
        run: ruff check cococat/

      - name: Run tests
        run: pytest tests/cococat/ cococat/tests/ -v
          --ignore=tests/cococat/test_sandbox.py
          --ignore=tests/cococat/test_api.py
          --ignore=cococat/tests/test_settings_api.py
          --ignore=cococat/tests/test_providers_api.py
          --ignore=cococat/tests/test_dag_api.py
          --ignore=cococat/tests/test_chat_sandbox.py
