<h2>Logo 具体程度</h2>
<p class="subtitle">极简几何方向已定，猫的「可辨识度」到什么程度？</p>

<div class="options">
  <div class="option" data-choice="a" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>纯符号 — 没有面部</h3>
      <p>只有几何轮廓：两个三角耳朵 + 一个圆/椭圆做脸 + 直线做直边。不画眼睛鼻子嘴。像 Nike 的钩子一样——你知道它是猫，但它首先是一个符号。对字形设计要求极高。</p>
    </div>
  </div>
  <div class="option" data-choice="b" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>极简面部 — 只留眼睛</h3>
      <p>几何猫头上加一对极简眼睛：两个圆点、两道斜线、或一块负空间。有「注视/智能/AI 正在看你」的感觉。仍然非常克制。</p>
    </div>
  </div>
  <div class="option" data-choice="c" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>节点网络猫头 — 眼睛即节点</h3>
      <p>猫头轮廓由多个小几何节点 + 连接线构成，节点本身充当眼睛和耳朵。一看就知道是「多智能体协作网络」——猫同时是拓扑图。</p>
    </div>
  </div>
</div>
